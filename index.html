<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Unofficial study tool for the Armenian driving-licence theory exam." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Armenian Driving Theory</title>
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var s = JSON.parse(localStorage.getItem('adt:settings:v1') || '{}')
        if (s && s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
